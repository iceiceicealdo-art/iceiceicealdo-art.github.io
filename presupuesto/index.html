<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Presupuesto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="calculadora">
                <h2>Calculadora de presupuesto</h2>
                
                <label for="horas">Horas de trabajo</label>
                <input type="number" id="horas" placeholder="Ej: 10" step="any">

                <label for="tarifa">Tarifa por hora</label>
                <input type="number" id="tarifa" placeholder="Ej: 25" step="any">

                <label for="descuento">Descuento (%)</label>
                <input type="number" id="descuento" placeholder="Ej: 10">

                <label for="materiales">Costo extra / Materiales (S/)</label>
                <input type="number" id="materiales" placeholder="Ej: 50 (opcional)">

                <button id="btn-calcular">Calcular</button>
                <div id="mensaje-error" class="error-msg" style="display: none;"></div>
                <div id="resultado" style="display: none;"></div>
            </div>
        </section>
    </main>

    <script src="script.js?v=2"></script>
</body>
</html>
